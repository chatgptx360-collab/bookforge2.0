version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      build-tooling:
        patterns: ['vite', '@vitejs/*', 'esbuild', 'typescript', 'tsx']
      document-libraries:
        patterns: ['docx', 'pdf-lib', 'pdf-parse', 'mammoth', 'adm-zip', 'jszip']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
